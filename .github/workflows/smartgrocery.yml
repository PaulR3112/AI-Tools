name: smartgrocery

on:
  push:
    paths: ["smartgrocery/**", ".github/workflows/smartgrocery.yml"]
  pull_request:
    paths: ["smartgrocery/**", ".github/workflows/smartgrocery.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartgrocery/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartgrocery_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    env:
      SG_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smartgrocery_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests alembic && ruff format --check app tests alembic/env.py
      - run: pytest -q
      - name: OpenAPI kontrakt sa dá vygenerovať
        run: python -c "import json; from app.main import app; json.dumps(app.openapi())"
