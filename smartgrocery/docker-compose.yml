# Lokálne dev prostredie: API + worker + PostgreSQL 16 (fronta úloh je tiež v Postgres)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartgrocery
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  migrate:
    build: ./backend
    env_file: .env
    environment:
      SG_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/smartgrocery
    command: ["smartgrocery", "migrate"]
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ./backend
    env_file: .env
    environment:
      SG_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/smartgrocery
    ports: ["8000:8000"]
    volumes: [rawdata:/data/raw]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: ./backend
    env_file: .env
    environment:
      SG_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/smartgrocery
    command: ["procrastinate", "--log-level=info", "--app=app.worker.app", "worker"]
    volumes: [rawdata:/data/raw]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  rawdata:
